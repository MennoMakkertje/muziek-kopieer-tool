<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muziek Kopieer Tool</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
h1 { margin-bottom: 20px; }
table { border-collapse: collapse; width: 100%; margin-top: 20px; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
th { background-color: #f4f4f4; }
tbody tr:nth-child(even) { background-color: #f9f9f9; }
tbody tr:nth-child(odd) { background-color: #eaeaea; }
input[type=number] { width: 60px; }
select { padding: 4px; }
button { padding: 10px 20px; margin-top: 20px; cursor: pointer; }
.preset-container { margin-top: 15px; }
.preset-btn { margin-top: 0; margin-right: 10px; padding: 6px 12px; }
</style>
</head>
<body>

<h1>Muziek Kopieer Tool</h1>
<label>Kies de map met partituren:</label>
<input type="file" id="fileInput" webkitdirectory directory multiple />

<div id="presetContainer" class="preset-container" style="display:none;">
  <strong>Snelaantallen instellen:</strong>
  <button type="button" class="preset-btn" onclick="applyPreset('KK')">KK</button>
  <button type="button" class="preset-btn" onclick="applyPreset('JK')">JK</button>
  <button type="button" class="preset-btn" onclick="applyPreset('JHK')">JHK</button>
</div>

<table id="fileTable" style="display:none;">
<thead>
<tr><th>Bestandsnaam</th><th>Aantal kopieën</th><th>Categorie</th></tr>
</thead>
<tbody></tbody>
</table>

<button id="createZipBtn" style="display:none;">Maak ZIP</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const fileInput = document.getElementById('fileInput');
const fileTable = document.getElementById('fileTable');
const tbody = fileTable.querySelector('tbody');
const createZipBtn = document.getElementById('createZipBtn');
const presetContainer = document.getElementById('presetContainer');

let loadedFiles = [];

// =========================================================================
// INSTELBARE PRESETS (pas de aantallen per instrument hier aan).
// Je kunt synoniemen scheiden met een komma (bijv. 'bekkens, cymbals').
// =========================================================================
const presets = {
    'KK': {
        'bekkens, cymbals': 0,
        'trompet': 0,
        'trom, snare drum': 0,
        'grote trom, bass drum': 0,
        'lyra': 0,
        'bastrompet, bas': 0,
        'jachthoorn': 0,
        'alt': 0,
        'sousafoon': 0,
        'cowbell': 0,
        'bongo': 0,
        'shaker': 0,
        'Directie': 0
    },
    'JK': {
        'bekkens, cymbals': 0,
        'trompet': 0,
        'trom, snare drum': 0,
        'grote trom, bass drum': 0,
        'lyra': 0,
        'bastrompet, bas': 0,
        'jachthoorn': 0,
        'alt': 0,
        'sousafoon': 0,
        'cowbell': 0,
        'bongo': 0,
        'shaker': 0,
        'Directie': 0

    },
    'JHK': {
        'bekkens, cymbals': 2,
        'trompet': 10,
        'trom, snare drum':7,
        'grote trom, bass drum': 1,
        'lyra': 3,
        'bastrompet, bas': 4,
        'jachthoorn': 11,
        'alt': 0,
        'sousafoon': 1,
        'cowbell': 1,
        'bongo': 1,
        'shaker': 1,
        'Directie': 0
    }
};

const slagwerkInstruments = ['trom', 'snare drum', 'bekkens', 'cymbals', 'grote trom', 'bass drum', 'cowbell', 'shaker', "bongo"];
const blazersInstruments = ['lyra', 'bastrompet', 'trompet', 'sousafoon', 'jachthoorn', 'alt', 'bas'];
const instrumentNumbers = {
    'jachthoorn': 1,
    'trompet': 2,
    'lyra': 3,
    'bastrompet': 4,
    'alt': 5,
    'sousafoon': 6,
    'trom': 1,
    'snare drum': 1,
    'bekkens': 2,
    'cymbals': 2,
    'grote trom': 3,
    'bass drum': 3,
    'cowbell': 4,
    'bongo': 5,
    'shaker': 6
};
const categoryNumbers = { 'Blazers': 1, 'Slagwerk': 2 };

fileInput.addEventListener('change', () => {
    tbody.innerHTML = '';
    loadedFiles = Array.from(fileInput.files).filter(f => f.name.toLowerCase().endsWith('.pdf'));
    if(loadedFiles.length === 0) return;

    loadedFiles.forEach((file, index) => {
        const row = document.createElement('tr');

        const nameCell = document.createElement('td');
        nameCell.textContent = file.name;

        const copyCell = document.createElement('td');
        const input = document.createElement('input');
        input.type = 'number';
        input.min = 0;
        input.value = 1;
        input.dataset.index = index;
        copyCell.appendChild(input);

        const categoryCell = document.createElement('td');
        const select = document.createElement('select');
        const optionNone = document.createElement('option');
        optionNone.value = '';
        optionNone.text = 'Selecteer';
        const optionBlazers = document.createElement('option');
        optionBlazers.value = 'Blazers';
        optionBlazers.text = 'Blazers';
        const optionSlagwerk = document.createElement('option');
        optionSlagwerk.value = 'Slagwerk';
        optionSlagwerk.text = 'Slagwerk';
        select.add(optionNone);
        select.add(optionBlazers);
        select.add(optionSlagwerk);

        const nameLower = file.name.toLowerCase();
        let assigned = false;
        for(const instr of blazersInstruments){
            if(nameLower.includes(instr)){
                select.value = 'Blazers';
                assigned = true;
                break;
            }
        }
        if(!assigned){
            for(const instr of slagwerkInstruments){
                if(nameLower.includes(instr)){
                    select.value = 'Slagwerk';
                    assigned = true;
                    break;
                }
            }
        }
        if(!assigned) select.value = '';

        categoryCell.appendChild(select);

        row.appendChild(nameCell);
        row.appendChild(copyCell);
        row.appendChild(categoryCell);
        tbody.appendChild(row);
    });

    fileTable.style.display = '';
    presetContainer.style.display = '';
    createZipBtn.style.display = '';
});

// Functie om de preset-aantallen toe te passen
function applyPreset(presetKey) {
    const selectedPreset = presets[presetKey];
    if (!selectedPreset) return;

    const rows = tbody.querySelectorAll('tr');
    rows.forEach((row, index) => {
        const fileName = loadedFiles[index].name.toLowerCase();
        const input = row.querySelector('input[type=number]');
        
        let matchFound = false;
        for (const [instruments, count] of Object.entries(selectedPreset)) {
            // Splits synoniemen die gescheiden zijn door een komma
            const synonyms = instruments.split(',').map(s => s.trim().toLowerCase());
            
            if (synonyms.some(instr => fileName.includes(instr))) {
                input.value = count;
                matchFound = true;
                break;
            }
        }
        
        // Als het bestand niet in de gekozen preset voorkomt, zetten we het aantal op 0
        if (!matchFound) {
            input.value = 0;
        }
    });
}

createZipBtn.addEventListener('click', async () => {
    const zip = new JSZip();

    const fileData = [];
    tbody.querySelectorAll('tr').forEach((row, index) => {
        const file = loadedFiles[index];
        const count = parseInt(row.querySelector('input[type=number]').value);
        const category = row.querySelector('select').value;
        fileData.push({file, count, category});
    });

    // Groepeer per categorie
    const blazersFiles = fileData.filter(f => f.category === 'Blazers');
    const slagwerkFiles = fileData.filter(f => f.category === 'Slagwerk');
    blazersFiles.sort((a,b) => a.file.name.localeCompare(b.file.name));
    slagwerkFiles.sort((a,b) => a.file.name.localeCompare(b.file.name));
    const finalList = [...blazersFiles, ...slagwerkFiles];

    // Counters per categorie
    const categoryCounters = { 'Blazers':1, 'Slagwerk':1 };

    finalList.forEach(item => {
        const catNum = categoryNumbers[item.category] || 0;
        let instrNum = 0;
        for(const [key, num] of Object.entries(instrumentNumbers)){
            if(item.file.name.toLowerCase().includes(key)){
                instrNum = num;
                break;
            }
        }
        if(instrNum === 0) instrNum = 0;

        const counter = categoryCounters[item.category];
        for(let i=1; i<=item.count; i++){
            zip.file(`${catNum} ${instrNum} ${counter} kopie${i} ${item.file.name}`, item.file);
        }
        categoryCounters[item.category] = counter + 1;
    });

    let folderName = 'partituren';
    if(loadedFiles.length > 0){
        const firstPath = loadedFiles[0].webkitRelativePath;
        folderName = firstPath.split('/')[0];
    }

    const content = await zip.generateAsync({type:'blob'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(content);
    a.download = folderName + '_kp.zip';
    a.click();
});
</script>

</body>
</html>
